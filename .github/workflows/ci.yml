name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The lockfile is generated on macOS, and npm does not record other
      # platforms' optional native binaries in it (npm/cli#4828). On Linux that
      # leaves the Tailwind/Turbopack toolchain without its .node files. Install
      # exactly the Linux equivalents of what the lockfile pins, without touching
      # the lockfile itself.
      - name: Install Linux native binaries missing from the macOS lockfile
        run: |
          npm install --no-save --no-audit --no-fund --workspace apps/web \
            lightningcss-linux-x64-gnu@1.32.0 \
            @tailwindcss/oxide-linux-x64-gnu@4.3.3 \
            @next/swc-linux-x64-gnu@16.3.2
      # The web app imports the workspace packages' build output.
      - run: npm run build --workspace packages/strk20-capability --workspace packages/core
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev

  cairo:
    name: Cairo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          # Scarb clones the privacy monorepo's own git dependencies. Leaving
          # checkout's credentials in the git config makes those clones fail with
          # a bare exit 128. We only need the source here, not push access.
          persist-credentials: false
      - name: Diagnose git access to the dependency repos
        run: |
          git --version
          for repo in starkware-libs/starkware-starknet-utils EkuboProtocol/starknet-contracts; do
            echo "--- $repo"
            git ls-remote --heads "https://github.com/$repo" >/dev/null && echo "reachable" || echo "FAILED $?"
          done
      # Versions come from .tool-versions, matching the privacy monorepo.
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: 2.18.0
          scarb-lock: contracts/Scarb.lock
          # The restored cache left a half-written git checkout that scarb could
          # not clean ("Directory not empty"). Correctness over a warm cache.
          cache: false
      - uses: foundry-rs/setup-snfoundry@v4
        with:
          starknet-foundry-version: 0.63.0
      # Scarb races itself resolving the same git dependency for several
      # dependents on a cold cache, and dies with "Directory not empty". Warm the
      # cache with a retry before building.
      - name: Fetch Cairo dependencies
        run: |
          for attempt in 1 2 3; do
            if scarb fetch; then exit 0; fi
            echo "scarb fetch attempt $attempt failed, retrying"
            rm -rf ~/.cache/scarb/registry/git
            sleep 5
          done
          exit 1
      - run: scarb build
      - run: scarb fmt --check
      - run: snforge test

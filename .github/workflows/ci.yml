name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # `npm ci` would be preferable, but the lockfile is generated on macOS and
      # npm does not record other platforms' optional native binaries in it
      # (npm/cli#4828). On Linux that leaves lightningcss, @tailwindcss/oxide and
      # @next/swc without their .node files and the Tailwind build fails. Versions
      # are still pinned by the lockfile; this only adds the platform binaries.
      - run: npm install --no-audit --no-fund
      # The web app imports the workspace packages' build output.
      - run: npm run build --workspace packages/strk20-capability --workspace packages/core
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev

  cairo:
    name: Cairo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      # actions/checkout installs a global auth header for github.com. Scarb sends
      # it when cloning the privacy monorepo's own git dependencies, which fails
      # with a bare `git` exit 128. Drop it before resolving dependencies.
      - name: Clear checkout's global git auth header
        run: git config --global --unset-all http.https://github.com/.extraheader || true
      # Versions come from .tool-versions, matching the privacy monorepo.
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: 2.18.0
          scarb-lock: contracts/Scarb.lock
          # The restored cache left a half-written git checkout that scarb could
          # not clean ("Directory not empty"). Correctness over a warm cache.
          cache: false
      - uses: foundry-rs/setup-snfoundry@v4
        with:
          starknet-foundry-version: 0.63.0
      - run: scarb build
      - run: scarb fmt --check
      - run: snforge test

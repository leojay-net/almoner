name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The web app imports the workspace packages' build output.
      - run: npm run build --workspace packages/strk20-capability --workspace packages/core
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev

  cairo:
    name: Cairo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      # Versions come from .tool-versions, matching the privacy monorepo.
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: 2.18.0
      - uses: foundry-rs/setup-snfoundry@v4
        with:
          starknet-foundry-version: 0.63.0
      - run: scarb build
      - run: scarb fmt --check
      - run: snforge test

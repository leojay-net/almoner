# Network profiles for sncast.
#
# starkli 0.4.2 speaks an older JSON-RPC spec than current endpoints serve and
# fails with "Invalid params" on every call, so deployment goes through sncast,
# which ships with the starknet-foundry version pinned in ../.tool-versions.
#
# Endpoint choice is not arbitrary: sncast 0.63 expects JSON-RPC 0.10, and most
# public Sepolia endpoints still serve 0.9 (which warns) or are discontinued.
# Checked 23 Aug 2026 - Blast is shut down, Nethermind's free endpoint does not
# resolve, cartridge serves 0.9.0, and Alchemy returns 429 on the free tier.
# publicnode serves 0.10.2 but is READ-ONLY - it fails at the transport layer on
# starknet_addDeclareTransaction. cartridge serves 0.9.0 (sncast warns) but does
# accept writes, so it is what deployment actually goes through.
#
# Account and keystore are passed on the command line rather than stored here -
# they are per-machine paths, and the keystore is password-protected.

[sncast.sepolia]
url = "https://api.cartridge.gg/x/starknet/sepolia"

# lava serves RPC 0.8.1, which sncast 0.63 rejects. cartridge serves 0.10.2.
[sncast.mainnet]
url = "https://api.cartridge.gg/x/starknet/mainnet"

# Network profiles for sncast.
#
# starkli 0.4.2 speaks an older JSON-RPC spec than current endpoints serve and
# fails with "Invalid params" on every call, so deployment goes through sncast,
# which ships with the starknet-foundry version pinned in ../.tool-versions.
#
# Account and keystore are passed on the command line rather than stored here —
# they are per-machine paths, and the keystore is password-protected.

[sncast.sepolia]
url = "https://api.cartridge.gg/x/starknet/sepolia"

[sncast.mainnet]
url = "https://rpc.starknet.lava.build"
